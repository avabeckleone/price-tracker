name: Amazon price check (every 2 hours)

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-price-check
  cancel-in-progress: false

jobs:
  track-prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Track prices
        run: python price_tracker.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated price history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update tracked prices"
            git push
          fi

      - name: Save CSV and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: price-check-${{ github.run_number }}
          path: |
            prices.csv
            screenshots/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
